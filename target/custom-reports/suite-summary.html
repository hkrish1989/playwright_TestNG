<!DOCTYPE html>
<html>
<head>
    <title>Test Execution Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 40px; color: #333; }
        .container { max-width: 650px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: 0 auto; }
        h2 { text-align: center; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; }
        .metric-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .metric-table th, .metric-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .metric-table th { background-color: #f8fafc; color: #64748b; font-weight: 600; }
        .pass { color: #2ed573; font-weight: bold; }
        .fail { color: #ff4757; font-weight: bold; }
        .skip { color: #ffa502; font-weight: bold; }
        .total { font-weight: bold; color: #2c3e50; }
        .footer { text-align: center; margin-top: 25px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class='container'>
        <h2>Test Suite Execution Report</h2>
        <p><strong>Suite Name:</strong> Suite</p>
        <table class='metric-table'>
            <tr><th>Metric Status</th><th>Count</th></tr>
            <tr class='pass'><td>Passed</td><td>1</td></tr>
            <tr class='fail'><td>Failed</td><td>0</td></tr>
            <tr class='skip'><td>Skipped</td><td>0</td></tr>
            <tr class='total'><td>Total Executed</td><td>1</td></tr>
        </table>
        <div class='footer'>Report generated automatically by TestNG Framework Suite Listener</div>
    </div>
</body>
</html>
